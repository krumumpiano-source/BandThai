<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1a1a">
  <title>รายงานวง — BandThai</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/compat.css">
  <link rel="stylesheet" href="css/reports.css">
</head>
<body>
  <div id="mainNav"></div>
  <div id="toast"></div>
  <main>
    <div class="container">
      <div class="print-header" id="printHeader">
        <h2>&#x1F6E1;&#xFE0F; รายงานวงดนตรี</h2>
        <p id="printSubtitle"></p>
      </div>
      <div class="page-header">
        <h1 class="page-title">&#x1F6E1;&#xFE0F; รายงานวง</h1>
        <button class="btn btn-secondary print-hide" onclick="printReport()">&#x1F5A8;&#xFE0F; พิมพ์รายงาน</button>
      </div>
      <div class="main-tabs print-hide">
        <button class="main-tab active" id="mainTabWork" onclick="switchMainTab('work')">&#x1F454; การทำงาน</button>
        <button class="main-tab" id="mainTabSetlist" onclick="switchMainTab('setlist')">&#x1F3B5; ลิสเพลง</button>
      </div>

      <!-- TAB การทำงาน -->
      <div id="tabWork">
        <div class="period-tabs">
          <button class="period-tab" data-work-period="week">สัปดาห์</button>
          <button class="period-tab active" data-work-period="month">เดือน</button>
          <button class="period-tab" data-work-period="year">ปี</button>
        </div>
        <div class="period-nav">
          <button class="nav-btn" id="wPrev" aria-label="Previous">&#9664;</button>
          <span class="period-label" id="wPeriodLabel">&#8212;</span>
          <button class="nav-btn" id="wNext" aria-label="Next">&#9654;</button>
        </div>
        <div class="member-selector" id="wMemberSelector" style="display:none">
          <span class="mgr-badge">&#x1F451; ผู้จัดการ</span>
          <select id="wMemberPicker"><option value="__all">&#x1F4CA; ทุกคนรวม</option></select>
        </div>
        <div id="shieldBanner"></div>
        <div class="overview-cards" id="wCards">
          <div class="ov-card"><div class="ico">&#x23F3;</div><div class="lbl">กำลังโหลด...</div></div>
        </div>
        <div class="report-card" id="wDetailCard">
          <h3>&#x1F4CB; รายละเอียดแต่ละวัน</h3>
          <div style="overflow-x:auto">
            <table class="report-table">
              <thead><tr><th>วันที่</th><th>วัน</th><th>สถานะ</th><th class="ctr">เบรค</th><th class="num">ชั่วโมง</th><th class="num">รายได้</th><th>หมายเหตุ</th></tr></thead>
              <tbody id="wDetailTbody"><tr><td colspan="7" class="loading-state">กำลังโหลด...</td></tr></tbody>
            </table>
          </div>
        </div>
        <div class="report-card" id="wAllMembersCard" style="display:none">
          <h3>&#x1F465; สรุปสมาชิกทั้งวง</h3>
          <div style="overflow-x:auto">
            <table class="report-table">
              <thead><tr><th>ชื่อ</th><th class="ctr">เบรค</th><th class="num">ชั่วโมง</th><th class="num">รายได้</th><th class="ctr">ลา(มีแทน)</th><th class="ctr">ลา(ไม่มี)</th><th class="num">อัตราเข้างาน</th></tr></thead>
              <tbody id="wAllTbody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- TAB ลิสเพลง -->
      <div id="tabSetlist" style="display:none">
        <div class="period-tabs">
          <button class="period-tab active" data-sl-period="day">รายวัน</button>
          <button class="period-tab" data-sl-period="week">รายสัปดาห์</button>
          <button class="period-tab" data-sl-period="month">รายเดือน</button>
        </div>
        <div class="date-picker-row" id="slDatePickerRow">
          <label style="font-size:var(--text-sm);font-weight:600">&#x1F4C5; เลือกวัน</label>
          <input type="date" id="slDateInput">
        </div>
        <div class="period-nav" id="slPeriodNav" style="display:none">
          <button class="nav-btn" id="slPrev" aria-label="Previous">&#9664;</button>
          <span class="period-label" id="slPeriodLabel">&#8212;</span>
          <button class="nav-btn" id="slNext" aria-label="Next">&#9654;</button>
        </div>
        <div class="sl-stat-cards" id="slStatCards" style="display:none"></div>
        <div id="slDistCard" class="dist-card" style="display:none"></div>
        <div id="slContent">
          <div class="sl-empty">&#x1F4C5; เลือกวันที่เพื่อดูรายงานลิสเพลง</div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/nav.js?v=20260610"></script>
  <script src="js/reports.js"></script>
</body>
</html>
