<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1a1a">
  <title>ขอสร้างวงใหม่ — BandThai</title>
  <!-- OG Tags -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="สร้างวงฟรี — BandThai">
  <meta property="og:description" content="สร้างวงดนตรีของคุณบน BandThai จัดการเพลง ตารางงาน Live Mode และอีกมากมาย!">
  <meta property="og:image" content="https://krumumpiano-source.github.io/BandThai/icons/icon-512.png">
  <meta property="og:url" content="https://krumumpiano-source.github.io/BandThai/create-band.html">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/compat.css">
  <link rel="stylesheet" href="css/create-band.css">
</head>
<body>
  <div id="toast"></div>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <h1>🎵 สร้างวงใหม่</h1>
        <p>สร้างวงฟรี ใช้งานได้ทันที</p>
        <p style="font-size:var(--text-xs);color:var(--premium-text-muted);margin-top:2px">BandThai</p>
      </div>

      <div class="info-box">
        ✨ กรอกแค่ 4 ช่อง — สร้างวงเสร็จใช้งานได้เลย!<br>
        <strong>ข้อมูลอื่นๆ กรอกเพิ่มทีหลังได้</strong>ในหน้าโปรไฟล์
      </div>

      <form id="createBandForm">
        <div class="form-group">
          <label>ชื่อวง <span style="color:#c53030">*</span></label>
          <input type="text" id="bandName" placeholder="เช่น วงดอกไม้, The Band" required>
          <div class="err-msg" id="bandNameError"></div>
        </div>

        <div class="form-group">
          <label>ชื่อเล่นของคุณ <span style="color:#c53030">*</span></label>
          <input type="text" id="nickname" placeholder="เช่น เอ, บอล, นุ่น" required>
          <div class="err-msg" id="nicknameError"></div>
        </div>

        <div class="form-group">
          <label>อีเมล <span style="color:#c53030">*</span></label>
          <input type="email" id="email" placeholder="กรุณากรอกอีเมล" required>
          <div class="err-msg" id="emailError"></div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>รหัสผ่าน <span style="color:#c53030">*</span></label>
            <input type="password" id="password" placeholder="8 ตัวขึ้นไป" required>
            <div class="err-msg" id="passwordError"></div>
          </div>
          <div class="form-group">
            <label>ยืนยันรหัสผ่าน <span style="color:#c53030">*</span></label>
            <input type="password" id="confirmPassword" placeholder="พิมพ์อีกครั้ง" required>
            <div class="err-msg" id="confirmError"></div>
          </div>
        </div>

        <div class="err-msg" id="generalError"></div>

        <button type="submit" class="btn btn-primary btn-full" id="submitBtn">🎵 สร้างวงเลย!</button>
      </form>

      <div class="auth-footer">
        <a href="register.html">มีรหัสวงแล้ว? สมัครเข้าร่วมวง</a>
        &nbsp;|&nbsp;
        <a href="index.html">เข้าสู่ระบบ</a>
      </div>
    </div>
  </div>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/create-band.js"></script>
</body>
</html>
