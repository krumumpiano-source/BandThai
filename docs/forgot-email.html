<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1a1a">
  <title>ลืมอีเมล — BandThai</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/compat.css">
  <link rel="stylesheet" href="css/forgot-email.css">
</head>
<body>
  <div id="toast"></div>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <h1>📧</h1>
        <h2 style="color:var(--premium-text);font-size:var(--text-xl)">ลืมอีเมล</h2>
        <p style="color:var(--premium-text-light);font-size:var(--text-sm)">กรอกชื่อและ/หรือเบอร์โทรศัพท์ที่เคยบันทึกไว้ในโปรไฟล์</p>
      </div>

      <div class="hint-box">
        💡 ระบบจะค้นหาจากข้อมูลที่คุณเคยบันทึกไว้ในหน้าโปรไฟล์ หากยังไม่เคยกรอกเบอร์โทร กรุณาติดต่อผู้จัดการวง
      </div>

      <form id="lookupForm">
        <div class="form-row-inline">
          <div class="form-group">
            <label>ชื่อ หรือ ชื่อเล่น</label>
            <input type="text" id="nameInput" placeholder="เช่น สมชาย หรือ ช้าง">
          </div>
          <div class="form-group">
            <label>เบอร์โทรศัพท์</label>
            <input type="tel" id="phoneInput" placeholder="0xx-xxx-xxxx">
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="searchBtn">
          🔍 ค้นหาอีเมลของฉัน
        </button>
      </form>

      <div id="results" style="display:none">
        <h3 style="margin-top:var(--spacing-lg);font-size:var(--text-base);color:var(--premium-text)">ผลการค้นหา</h3>
        <div id="resultList"></div>
      </div>

      <div class="auth-footer">
        <a href="index.html">← กลับไปเข้าสู่ระบบ</a>
        &nbsp;|&nbsp;
        <a href="forgot-password.html">ลืมรหัสผ่าน?</a>
      </div>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/forgot-email.js"></script>
</body>
</html>
