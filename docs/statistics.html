<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1a1a">
  <title>รายได้รวม — BandThai</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/compat.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="css/statistics.css">
</head>
<body>
  <div id="mainNav"></div>
  <div id="toast"></div>
  <main>
    <div class="container">
      <div class="page-header">
        <h1 class="page-title">� รายได้รวม</h1>
        <button class="btn btn-secondary" onclick="window.print()">🖨️ พิมพ์</button>
      </div>

      <!-- Period Tabs -->
      <div class="period-tabs" id="periodTabs">
        <button class="period-tab" data-period="day">รายวัน</button>
        <button class="period-tab active" data-period="week">สัปดาห์</button>
        <button class="period-tab" data-period="month">เดือน</button>
        <button class="period-tab" data-period="year">ปี</button>
      </div>

      <!-- Period Navigation -->
      <div class="period-nav">
        <button class="nav-btn" id="prevPeriod" aria-label="Previous">◀</button>
        <span class="period-label" id="periodLabel">—</span>
        <button class="nav-btn" id="nextPeriod" aria-label="Next">▶</button>
      </div>

      <!-- Manager: member selector -->
      <div class="member-selector" id="memberSelector" style="display:none">
        <span class="mgr-badge">👑 ผู้จัดการ</span>
        <select id="memberPicker">
          <option value="__all">📊 ทุกคนรวม</option>
        </select>
      </div>

      <!-- Overview Cards -->
      <div class="stat-overview" id="overviewCards"></div>

      <!-- Charts -->
      <div class="charts-grid" id="chartsArea">
        <div class="chart-card">
          <h3>📈 รายได้ตามช่วงเวลา</h3>
          <div class="chart-canvas-wrap"><canvas id="chartEarnings"></canvas></div>
        </div>
        <div class="chart-card">
          <h3>⏱️ ชั่วโมงทำงาน</h3>
          <div class="chart-canvas-wrap"><canvas id="chartHours"></canvas></div>
        </div>
        <div class="chart-card">
          <h3>🚫 สรุปวันลา</h3>
          <div class="chart-canvas-wrap"><canvas id="chartLeave"></canvas></div>
        </div>
        <div class="chart-card">
          <h3>🔄 ค่าจ้างคนแทน</h3>
          <div class="chart-canvas-wrap"><canvas id="chartSub"></canvas></div>
        </div>
      </div>

      <!-- Daily Detail Table -->
      <div class="detail-card" id="detailCard">
        <h3>📋 รายละเอียดแต่ละวัน</h3>
        <div style="overflow-x:auto">
          <table class="detail-table" id="detailTable">
            <thead><tr><th>วันที่</th><th>สถานะ</th><th>เบรค</th><th>ชม.</th><th>รายได้</th><th>คนแทน</th><th>จ่ายคนแทน</th></tr></thead>
            <tbody id="detailTbody"><tr><td colspan="7" style="text-align:center;color:var(--premium-text-muted)">กำลังโหลด...</td></tr></tbody>
          </table>
        </div>
      </div>

      <!-- Manager: All Members Summary -->
      <div class="all-members-card" id="allMembersCard" style="display:none">
        <h3>👥 สรุปสมาชิกทั้งวง</h3>
        <div style="overflow-x:auto">
          <table class="all-members-table">
            <thead><tr><th>สมาชิก</th><th>เบรค</th><th>ชม.</th><th>รายได้</th><th>ลา(มีแทน)</th><th>ลา(ไม่มี)</th><th>จ่ายคนแทน</th><th>คงเหลือ</th></tr></thead>
            <tbody id="allMembersTbody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/nav.js?v=20260319b"></script>
  <script src="js/statistics.js"></script>
</body>
</html>
